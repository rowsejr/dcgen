# dcgen module catalogue
# -----------------------------------------------------------------------------
# STATUS: INDICATIVE PLACEHOLDERS for scaffolding only.
# Replace every value with Cundall standard module data or manufacturer data,
# record the source + date against each entry, and get it engineer-checked.
# The engines never hard-code plant sizes: they read them from here, so the
# catalogue is the thing your team owns and signs off.
# -----------------------------------------------------------------------------
meta:
  version: "0.1"
  status: INDICATIVE
  owner: "Datacentres team"

gensets:                       # containerised diesel sets, standby rating
  # Sizes follow project benchmarks (2026-11-20): a 2.8-3.2 MW LV set at 75 dB(A) @ 1 m needs about
  # 18-19 m x 4 m x 5.5 m including inlet/outlet attenuators and SCR, 70-100 t. Engine size changes the
  # footprint little; 2.5 -> 3 MW mostly adds weight, fuel and flue. lw_dba = 75 dB(A) @ 1 m all round.
  # The largest set a project may use is electrical.genset_max_kva (single-source framework limit).
  gen_2500:
    label: "2,500 kVA genset (2.0 MW standby)"
    kva: 2500
    kwe: 2000
    length: 18.4               # m incl. attenuators and flue, laid perpendicular to facade
    width: 4.0
    height: 5.5
    side_clear: 1.5            # gap between adjacent sets
    end_clear: 4.0             # maintenance / fuel aisle at the outer end
    lw_dba: 101.6              # 75 dB(A) @ 1 m
    fuel_l_per_kwh: 0.26
  gen_3000:
    label: "3,000 kVA genset (2.4 MW standby)"
    kva: 3000
    kwe: 2400
    length: 18.5
    width: 4.0
    height: 5.5
    side_clear: 1.5
    end_clear: 4.0
    lw_dba: 101.7
    fuel_l_per_kwh: 0.26
  gen_3200:
    label: "3,200 kVA genset (2.56 MW standby), single-source framework size"
    kva: 3200
    kwe: 2560
    length: 18.5
    width: 4.0
    height: 5.5
    side_clear: 1.5
    end_clear: 4.0
    lw_dba: 101.7
    fuel_l_per_kwh: 0.26
  gen_3500:
    label: "3,500 kVA genset (2.8 MW standby, 2.5 MW DCC)"
    kva: 3500
    kwe: 2800
    length: 18.0
    width: 4.0
    height: 5.7                # with SCR
    side_clear: 1.5
    end_clear: 4.0
    lw_dba: 101.7
    fuel_l_per_kwh: 0.26

transformers:                  # outdoor, bunded, with fire separation
  tx_2500: {label: "2,500 kVA transformer", kva: 2500, length: 3.6, width: 2.6, height: 3.2, clear: 1.5}
  tx_3150: {label: "3,150 kVA transformer", kva: 3150, length: 3.9, width: 2.8, height: 3.4, clear: 1.5}
  tx_4000: {label: "4,000 kVA transformer", kva: 4000, length: 4.3, width: 3.0, height: 3.6, clear: 1.5}

electrical_rooms:              # UPS + batteries + LV switchboard per block
  depth: 16.0                  # m perpendicular to the facade
  width_base: 4.0              # m per block
  width_per_mw: 4.0            # m per MW of block UPS rating
  level_height: 5.5            # m per level
  sts_room_width: 8.0          # per catcher group (static transfer switches)
  mv_room_width: 12.0          # customer MV switchroom (one per building)
  ups_module_kw: 1250

electrical:                    # LV lineup limits (project engineer, 2026-11-20). Confirm per project.
  genset_max_kva: 3200         # largest genset allowed on a lineup (single-source Kohler framework); 3500 where Cummins/CAT allowed
  ups_kva_per_lineup: 2200     # UPS per IT lineup; the IT block is capped at ups_kva x ups_pf
  ups_pf: 1.0
  mech_kw_per_lineup: 600      # mechanical load one IT lineup can carry: ~3,200 kVA x 0.8 = 2,560 kWe less the 2.2 MVA UPS
  mech_pf: 0.9                 # mechanical load kVA = kW / mech_pf
  ups_eff_full: 0.97           # UPS efficiency at full block load (genset sizing)
  mech_lineup_kw: 2300         # usable kW on a dedicated mechanical lineup (one genset + transformer)
  mech_lineup_redundancy: "N+1"
  mech_room_width: 6.0         # mechanical LV switchroom per mechanical lineup, along the facade

peak_pue:                      # design-point (peak) PUE for plant sizing, after CUN-CAL-PUE-001 (Cundall PUE calc).
  # Values from the DC01 workbook (54 MW, 6 x 9 MW halls) unless noted; "project B" (180 MW, hot climate) shown for range.
  # the air-on uplift (recirculation in plant arrays) is a brief value: hr_uplift_k (DC01 5 K, project B 2 K)
  distribution_gains_frac: 0.01   # hall heat from distribution, of IT
  fan_gains_frac: 0.05            # fan wall / CRAH heat, of hall load
  hall_lighting_w_m2: 8.0         # hall lighting heat
  elec_room_cooling_frac: 0.10    # UPS pods / PDU galleries on the CHW system, of IT (DC01 10%, project B 8%)
  air_fan_kw_per_kw: 0.035        # fan walls / CRAHs, input per kW of hall load at normal duty (DC01 0.035, project B 0.031)
  cdu_kw_per_kw: 0.004            # CDU pumps per kW of liquid-cooled load (project B)
  liquid_share: {air_chw: 0.0, hybrid: 0.56, liquid_dtc: 0.9}   # share of IT heat on the liquid loop (DC01 hybrid 56/44)
  chw_pump_kw_per_kw: 0.018       # CHW pumps per kW gross CHW load (DC01 0.018, project B 0.014)
  pumps_on_ups: true              # CHW pumps UPS-backed (continuous cooling): their power carries UPS loss
  dry_cooler_fan_kw_per_kw: 0.025 # dry / adiabatic cooler fans per kW rejected at peak
  secondary_cooling_frac: 0.006   # CRAH / DX for MMR, IDFs, battery and switch rooms, of IT
  ventilation_frac: 0.001         # AHU fans and ventilation, of IT
  ups_loss_frac: 0.025            # of UPS-backed (IT) load (DC01 2.5%, project B 3.8%)
  lv_loss_frac: 0.015             # of total LV load, IT + mechanical (DC01 1.5%, project B 2.0%)
  busbar_loss_frac: 0.0006        # of IT
  rmu_loss_kw: 0.5                # per IT lineup
  tx_loss_frac: 0.0075            # per transformer at full load, of kVA (DC01 21 kW / 2.8 MVA, project B 31.5 / 3.15)
  lighting_w_m2_gia: 0.4          # building lighting, electrical (DC01 8 W/m2 x 0.05 diversity)
  chiller_eer:                    # generic EER at 100% load where a record has no EER data
    ref_chw_flow_c: 20.0
    ref_ambient_c: 35.0
    eer_at_ref: {screw: 4.0, centrifugal: 4.3, turbocor: 4.3, scroll: 3.6, default: 4.0}
    # EER(T) / EER(35 C): median of four 1,750 kW free-cooling chiller selections at 100% load (DC01,
    # 25-42 C); 45 and 50 C extended with the Carnot ratio (approaches below). Clamped (and flagged) outside.
    shape_ambient_c: [25, 30, 35, 38, 40, 42, 45, 50]
    shape_ratio: [1.62, 1.175, 1.00, 0.911, 0.86, 0.824, 0.759, 0.671]
    capacity_per_k_chw: 0.02      # capacity change per K of CHW flow vs the record's rated CHW (only when stated)
    evap_approach_k: 3.0          # CHW flow correction (Carnot): evaporating = CHW flow - approach
    cond_approach_k: 10.0         # condensing = air-on + approach

heat_rejection:
  acc_fc_1400:
    type: air_cooled_chiller
    label: "Air-cooled free-cooling chiller ~1.4 MW"
    compressor: screw
    capacity_kw: 1400          # at rated ambient and design CHW temperatures
    rated_ambient_c: 35.0
    derate_per_k: 0.012        # fraction of capacity lost per K above rated ambient
    max_ambient_c: 48.0
    length: 12.0
    width: 2.3
    height: 2.6
    intake_clear: 3.0          # gap between long sides of adjacent units (air intake); units stand perpendicular to the facade
    row_clear: 3.5             # end-to-end gap between rows (discharge / maintenance)
    lw_dba: 92
    operating_kg: 13000
  dc_vbank_1100:
    type: dry_cooler
    label: "V-bank dry cooler ~1.1 MW (warm water)"
    capacity_kw: 1100
    rated_ambient_c: 35.0
    rated_fluid_in_c: 45.0     # capacity scales with (fluid in - ambient)
    max_ambient_c: 42.0
    length: 12.2
    width: 2.4
    height: 2.7
    intake_clear: 3.0
    row_clear: 3.5
    lw_dba: 88
    operating_kg: 6000
  adc_1300:
    type: adiabatic_dry_cooler
    label: "Adiabatic dry cooler ~1.3 MW"
    capacity_kw: 1300
    rated_ambient_c: 35.0
    rated_fluid_in_c: 40.0
    adiabatic_effectiveness: 0.75
    max_ambient_c: 46.0
    length: 12.2
    width: 2.4
    height: 2.8
    intake_clear: 3.0
    row_clear: 3.5
    lw_dba: 89
    operating_kg: 6500

halls:
  hot_aisle: 1.2               # contained hot aisle
  cold_aisle: 1.8
  end_aisle: 1.5               # at each row end
  perimeter: 1.0               # clear zone round the rack area
  gallery_air: 3.5             # fan-wall / CRAH gallery depth, each row end
  gallery_liquid: 4.5          # CDU + fan-wall gallery (liquid / hybrid halls)
  storey_height: 8.0
  corridor_depth: 4.0          # between halls and electrical rooms
  mech_gallery_depth: 8.0      # pipework / pumps between halls and heat rejection
  support_length: 24.0         # admin, NOC, loading, build rooms (along the building)
  parapet: 1.5
  roof_edge: 3.0               # clear zone to roof edge for roof plant
  round_to: 0.6                # planning module: hall dimensions round up to this (0 = off)
  fire_wall: 0.4               # fire-rated wall between adjacent halls (compartment line)
  cross_corridor_width: 3.0    # escape/service corridor linking main corridor to the mech gallery
  cross_corridor_every: 2      # halls between cross corridors (0 = none)

layout:                        # building-core assembly gaps (m)
  band_step: 2.0               # electrical band grows in steps of this when rooms do not fit
  tx_to_building: 2.0          # building face to first transformer row
  tx_to_gen_yard: 3.0          # last transformer row to first genset row
  genset_tier_gap: 0.8         # vertical gap between stacked genset tiers
  hr_yard_offset: 3.0          # mech gallery wall to first ground heat rejection row
  hr_yard_margin: 2.0          # beyond the last heat rejection row
  hr_group_lane: 0.0           # extra lane between per-hall heat rejection groups (0 = hall/fire-wall lines only)

egress:                        # PLACEHOLDERS: set from the project fire strategy
  travel_one_dir_m: 25.0       # max travel where only one escape direction exists
  travel_two_dir_m: 45.0       # max travel with alternative routes
  dead_end_m: 18.0             # max dead-end corridor length
  door_width: 1.2
  doors_per_hall_wall: 2       # hall doors on each of the corridor and gallery walls
  exit_lane_width: 1.5         # clear outside lane from a final exit
  exit_lane_length: 12.0       # lane length that must be clear of plant (to open space/road)
  stair: {length: 6.0, width: 3.0}
  support_exits: 2
  hr_lane_width: 3.0           # escape lane between per-hall heat rejection groups (gallery exits discharge here)
  plant_room_exits: false      # true = direct final exit from each ground-level electrical room (needs clear lanes through TX/gen yard)

site:
  substation:                  # utility compound by supply voltage
    - {voltage: "33 kV", max_mva: 40, length: 30, width: 20, height: 4}
    - {voltage: "132 kV", max_mva: 150, length: 75, width: 55, height: 8}
    - {voltage: "400 kV", max_mva: 600, length: 140, width: 90, height: 12}
  guardhouse: {length: 10, width: 6, height: 3.5, from_gate: 28}
  sprinkler:
    tanks: 2
    tank_diameter: 11.0
    tank_height: 7.0
    pump_house: {length: 12, width: 8, height: 4}
    gap: 3.0
  fuel:
    tank_m3: 100
    tank: {length: 15.0, width: 4.0, height: 4.0}
    tank_gap: 2.0
    bund_margin: 1.5
    min_to_building: 10.0      # placeholder: confirm with fire engineer / insurer
    min_to_boundary: 6.0
  roads: {width: 7.3, clearance: 3.0, connector_width: 6.0}
  clearances:                  # placement gaps (m) used by the site engine
    ring_keepout: 2.0          # beyond the ring road: no ancillaries
    spur_keepout: 1.0
    spur_extension: 2.0        # spur extends beyond the redline
    spur_overlap: 1.0          # spur extends into the ring road
    guardhouse_min_from_gate: 8.0
    guardhouse_end_margin: 6.0 # spare spur length beyond the guardhouse
    guardhouse_to_road: 2.0
    guardhouse_keepout: 3.0
    gate_beyond_guardhouse: 4.0
    ancillary_gap: 3.0         # between placed ancillaries
    parking_gap: 2.0
    connector_keepout: 1.0
  parking: {bay_w: 2.5, bay_d: 5.0, aisle: 6.0}
  checks:
    max_road_distance: 10.0    # ancillaries within this of a road
    fire_access_distance: 45.0 # facade within this of a road/hardstanding (placeholder: set from the fire strategy)
    gate_zone_depth: 48.0      # clear depth from main access to the core (guardhouse + queuing)
