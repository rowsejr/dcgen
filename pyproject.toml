[project]
name = "dcgen"
version = "0.1.0"
description = "Agentic datacentre RIBA Stage 2 test-fit / layout generator (scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "shapely>=2.0",
  "numpy>=1.26",
  "pyyaml>=6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
bim = ["ifcopenshell>=0.8", "ezdxf>=1.2", "trimesh>=4", "mapbox-earcut>=1.0"]
mcp = ["mcp>=2.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
library = ["openpyxl>=3.1"]
llm = ["anthropic>=0.40"]          # only for scripts/batch_extract.py
dev = ["pytest>=8", "httpx>=0.27"]
all = ["dcgen[bim,mcp,web,library,dev]"]

[project.scripts]
dcgen = "dcgen.cli:main"
dcgen-mcp = "dcgen.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dcgen*"]

[tool.setuptools.package-data]
dcgen = ["data/*.yaml", "export/*.html", "web/*.html"]
